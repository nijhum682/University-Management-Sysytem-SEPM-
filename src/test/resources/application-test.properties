# ============================================================
# Test Configuration - Uses H2 In-Memory Database
# No real MySQL needed for running tests
# ============================================================

# H2 In-Memory Database (auto-configured for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Thymeleaf cache
spring.thymeleaf.cache=false

# Disable unnecessary auto-configurations for tests
spring.security.user.name=admin
spring.security.user.password=admin
