<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="text-center p-4">
    <div class="display-1 text-danger fw-bold">403</div>
    <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
    <h2 class="mt-3">Access Denied</h2>
    <p class="text-muted lead">You do not have permission to view or manage this resource.</p>
    <div class="mt-4">
        <a th:href="@{/}" class="btn btn-primary me-2"><i class="bi bi-house-door me-1"></i> Return to Dashboard</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
