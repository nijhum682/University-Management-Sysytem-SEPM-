<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/admin/dashboard}">
            <i class="bi bi-mortarboard-fill me-2"></i> University System
        </a>
        <div class="d-flex align-items-center text-white">
            <span class="badge bg-danger me-3 badge-role">ADMIN</span>
            <span class="me-3 d-none d-md-inline" th:text="${currentUser}">admin@university.com</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar py-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/admins}">
                        <i class="bi bi-shield-lock me-2"></i> Manage Admins
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/teachers}">
                        <i class="bi bi-person-badge me-2"></i> Manage Teachers
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/students}">
                        <i class="bi bi-people me-2"></i> Manage Students
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">Manage Students</h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                    <i class="bi bi-person-plus-fill me-1"></i> Add New Student
                </button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Department</th>
                                    <th>Semester</th>
                                    <th>Role</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="student : ${students}">
                                    <td th:text="${student.id}">1</td>
                                    <td><span class="badge bg-secondary" th:text="${student.studentId}">STU-1001</span></td>
                                    <td th:text="${student.name}">Student Name</td>
                                    <td th:text="${student.email}">student@university.com</td>
                                    <td th:text="${student.department}">CS</td>
                                    <td th:text="${student.semester}">4th</td>
                                    <td><span class="badge bg-primary" th:text="${student.role != null ? (student.role.startsWith('ROLE_') ? student.role.substring(5) : student.role) : 'STUDENT'}">STUDENT</span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-secondary me-1"
                                                th:data-id="${student.id}"
                                                th:data-studentid="${student.studentId}"
                                                th:data-name="${student.name}"
                                                th:data-email="${student.email}"
                                                th:data-department="${student.department}"
                                                th:data-semester="${student.semester}"
                                                onclick="openEditStudentModal(this)">
                                            <i class="bi bi-pencil-square"></i> Edit
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger"
                                                th:onclick="'deleteEntity(\'/api/students\', ' + ${student.id} + ', \'Student\')'">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add Student Modal -->
<div class="modal fade" id="addStudentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Add Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addStudentForm" autocomplete="off" onsubmit="submitEntityForm(event, 'addStudentForm', '/api/students')">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Student ID (Registration Number)</label>
                        <input type="text" class="form-control" name="studentId" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" autocomplete="new-password" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="department" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Semester</label>
                        <input type="text" class="form-control" name="semester" autocomplete="off" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Student</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Student Modal -->
<div class="modal fade" id="editStudentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editStudentForm">
                <input type="hidden" id="editStudentId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="editStudentStudentId" name="studentId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="editStudentName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="editStudentEmail" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" id="editStudentDepartment" name="department" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Semester</label>
                        <input type="text" class="form-control" id="editStudentSemester" name="semester" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password <small class="text-muted">(leave blank to keep unchanged)</small></label>
                        <input type="password" class="form-control" id="editStudentPassword" name="password" minlength="6">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitEditStudent()">Update Student</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
function openEditStudentModal(btn) {
    document.getElementById('editStudentId').value = btn.getAttribute('data-id');
    document.getElementById('editStudentStudentId').value = btn.getAttribute('data-studentid');
    document.getElementById('editStudentName').value = btn.getAttribute('data-name');
    document.getElementById('editStudentEmail').value = btn.getAttribute('data-email');
    document.getElementById('editStudentDepartment').value = btn.getAttribute('data-department');
    document.getElementById('editStudentSemester').value = btn.getAttribute('data-semester');
    document.getElementById('editStudentPassword').value = '';
    new bootstrap.Modal(document.getElementById('editStudentModal')).show();
}

function submitEditStudent() {
    const id = document.getElementById('editStudentId').value;
    submitEntityForm(event, 'editStudentForm', '/api/students', true, id);
}
</script>
</body>
</html>
