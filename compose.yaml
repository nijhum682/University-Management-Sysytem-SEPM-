services:
  mysqldb:
    image: mysql:8.0
    container_name: university-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: university_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: university_db
      DB_USER: root
      DB_PASSWORD: rootpassword
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
