name: University Management System - CI Tests

# ============================================================
# Trigger: runs on every push and pull request to main branch
# ============================================================
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (matches the project's java.version in pom.xml)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Cache Maven dependencies to speed up builds
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: Run all tests (Unit + Integration) using H2 in-memory DB
      #         No MySQL service needed — tests use H2 via spring.profiles.active=test
      - name: Run All Tests (6 Unit + 3 Integration)
        run: mvn test -Dspring.profiles.active=test --no-transfer-progress

      # Step 5: Upload test reports as artifacts so you can download & view them
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()   # upload even if tests fail — useful for debugging
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
